name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 手动构建时填写版本号（如 v0.1.0），仅用于产物命名
        required: false
        default: manual

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 不使用 cache: npm
          # setup-node 默认缓存键只 hash package-lock.json，不包含 .npmrc。
          # 一旦某次 workflow 因 devDep 被跳过而把坏 node_modules 缓存下来，
          # 后续任何 .npmrc / --include=dev 修复都会被旧缓存覆盖。
          # 本项目依赖量中等（electron + electron-builder + vite + tsc + vitest），
          # 重装一次 1~2 分钟，换确定性更划算。

      - name: Install dependencies
        shell: pwsh
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          # electron / electron-builder / electron-vite / vite / vitest / typescript
          # 全部位于 devDependencies，显式关闭 production 模式确保它们一定被安装
          NODE_ENV: ''
        run: |
          Write-Host "=== 清理残留 node_modules ==="
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          Write-Host "=== npm ci（含 devDependencies）==="
          npm ci --include=dev --no-audit --no-fund
          Write-Host "=== 顶层依赖计数 ==="
          $dirs = @(Get-ChildItem node_modules -Directory)
          Write-Host "node_modules 一级目录数 = $($dirs.Count)"
          if ($dirs.Count -eq 0) {
            Write-Error "npm ci 装完后 node_modules 为空：通常是 package.json 未声明依赖，或 package.json 与 package-lock.json 不一致。"
            exit 1
          }

      # 硬校验：package.json 必须声明依赖 + 关键 devDep CLI 必须落到 node_modules/.bin
      # 任何一个缺失立即终止（不要等到打包步骤才给含糊的 "not recognized"）
      - name: Verify devDependencies installed
        shell: pwsh
        run: |
          # 前置断言：package.json 必须声明依赖。
          # 历史上 CI 全链路报 "tsc / vitest / electron-vite not recognized" 的根因，
          # 就是 package.json 丢失了 dependencies / devDependencies 字段，
          # 导致 npm ci 装出空 node_modules（而 lockfile 里其实有 16 个依赖）。
          $raw = Get-Content -Path 'package.json' -Raw
          $pkg = ConvertFrom-Json -InputObject $raw
          $depCount = 0
          if ($pkg.dependencies)    { $depCount = @($pkg.dependencies.PSObject.Properties).Count }
          $devCount = 0
          if ($pkg.devDependencies) { $devCount = @($pkg.devDependencies.PSObject.Properties).Count }
          Write-Host "package.json 声明：dependencies=$depCount  devDependencies=$devCount"
          if ($depCount -eq 0 -and $devCount -eq 0) {
            Write-Error "package.json 未声明任何依赖：npm ci 不会安装任何包。请恢复 dependencies / devDependencies（可参照 package-lock.json 根节点的声明）。"
            exit 1
          }

          $root = (Get-Location).Path
          $checks = @(
            @{ pkg = 'electron-vite';    bin = 'electron-vite.cmd'   },
            @{ pkg = 'electron-builder'; bin = 'electron-builder.cmd' },
            @{ pkg = 'typescript';       bin = 'tsc.cmd'             },
            @{ pkg = 'vitest';           bin = 'vitest.cmd'          }
          )
          $missing = @()
          foreach ($c in $checks) {
            $binPath = Join-Path (Join-Path $root 'node_modules\.bin') $c.bin
            $pkgPath = Join-Path (Join-Path $root ("node_modules\" + $c.pkg)) 'package.json'
            $binOk = Test-Path $binPath
            $pkgOk = Test-Path $pkgPath
            Write-Host "  检查 $($c.pkg)  bin=$($c.bin)  binOK=$binOk  pkgOK=$pkgOk"
            if (-not $binOk) { $missing += "bin 缺失: $binPath" }
            if (-not $pkgOk) { $missing += "包缺失: $pkgPath" }
          }
          if ($missing.Count -gt 0) {
            Write-Host "!!! devDependencies 安装不完整 !!!" -ForegroundColor Red
            $missing | ForEach-Object { Write-Host ("  " + $_) -ForegroundColor Red }
            Write-Error "devDependencies 缺失：$($missing.Count) 项。请检查 runner 上是否有 NODE_ENV=production / NPM_CONFIG_PRODUCTION 等环境变量。"
            exit 1
          }
          Write-Host "devDependencies 校验通过 ✓" -ForegroundColor Green

      # 先跑 typecheck / 单测。任何失败只告警不终止（主目标是产安装包，
      # 质量门禁可后续拆到独立 workflow）
      - name: Typecheck & Unit Tests
        shell: pwsh
        env:
          NODE_ENV: ''
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "typecheck 失败，继续打包（退出码=$LASTEXITCODE）"
          } else {
            Write-Host "typecheck 通过" -ForegroundColor Green
          }

          npm test
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "单测失败，继续打包（退出码=$LASTEXITCODE）"
          } else {
            Write-Host "单测通过" -ForegroundColor Green
          }

      - name: Build Windows installer
        shell: pwsh
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "=== npm run dist:win ==="
          npm run dist:win
          Write-Host "=== dist 目录内容 ==="
          Get-ChildItem dist | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

      - name: Rename artifact
        shell: pwsh
        run: |
          # 触发来源：tag 推送 → ref_name=vX.Y.Z 直接用；
          #           workflow_dispatch → ref_name=main，改用 tag_name 输入
          $tag = "${{ github.ref_name }}"
          if ($tag -eq 'main' -or $tag -eq 'refs/heads/main' -or -not $tag) {
            $tag = "${{ github.event.inputs.tag_name }}"
          }
          if (-not $tag -or $tag -eq '') { $tag = 'dev' }

          $exe = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "dist 目录中未找到 .exe，electron-builder 可能执行失败"
            exit 1
          }
          $newName = "SeerBrowserPro-$tag-Setup.exe"
          Rename-Item -Path $exe.FullName -NewName $newName
          Write-Host "重命名: $($exe.Name) → $newName" -ForegroundColor Cyan

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # 统一用 workflow_dispatch.tag_name（手动触发）或 ref_name（tag 触发）
          # 本地计算一次 tag 名后传给 matrix 太麻烦，这里简化：tag 触发时
          # ref_name=vX.Y.Z 已是期望；手动触发时 ref_name=main 但用户输入 tag_name
          # 此处用 ref_name 即可（artifact 名错一点无所谓，下面 Release 会用正确 tag）
          name: SeerBrowserPro-${{ github.ref_name }}
          path: dist/*.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SeerBrowserPro ${{ github.ref_name }}
          body: |
            ## SeerBrowserPro ${{ github.ref_name }}

            基于 YOLO26 的 Canvas 网页游戏自动化浏览器。

            **安装**：下载下方 `SeerBrowserPro-${{ github.ref_name }}-Setup.exe`，双击运行安装向导即可。
          files: dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
