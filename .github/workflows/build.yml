name: Build & Release

# 触发方式：推送标签（vX.Y.Z）自动发布；也可在 Actions 页面手动运行
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '手动构建时填写版本号（如 v0.1.0），仅用于产物命名'
        required: false
        default: 'manual'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 注意：不使用 cache: npm
          # 原因：setup-node 默认缓存键不包含 .npmrc，
          # 一旦某次 workflow 因 devDep 被跳过而把坏 node_modules 缓存下来，
          # 后续再改 .npmrc / --include=dev 都白搭，缓存会被反复还原。
          # 本项目依赖量中等（electron + electron-builder + vite + tsc + vitest），
          # 重装一次约 1~2 分钟，牺牲几秒换确定性更划算。

      # Electron 二进制 + onnxruntime-node 原生 .node 必须在 Windows runner 下载
      - name: Install dependencies
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          # 显式 NODE_ENV='' 防止 runner 从系统变量继承 production
          NODE_ENV: ''
        shell: pwsh
        run: |
          # 强制清掉可能遗留的旧 node_modules，避免半安装状态复现
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          npm ci --include=dev --no-audit --no-fund

      # 硬校验：devDep 里关键的 CLI 必须真实落到 node_modules/.bin
      # 任何一个缺失 → 直接终止 workflow，避免到打包步骤才炸（错误信息更含糊）
      - name: Verify devDependencies installed
        shell: pwsh
        run: |
          $missing = @()
          @(
            @{ pkg='electron-vite'; bin='electron-vite.cmd' },
            @{ pkg='electron-builder'; bin='electron-builder.cmd' },
            @{ pkg='typescript'; bin='tsc.cmd' },
            @{ pkg='vitest'; bin='vitest.cmd' }
          ) | ForEach-Object {
            $binPath = Join-Path 'node_modules\.bin' $_.bin
            $pkgPath = Join-Path "node_modules\$($_.pkg)\package.json"
            if (-not (Test-Path $binPath)) {
              $missing += "bin 缺失: $binPath"
            }
            if (-not (Test-Path $pkgPath)) {
              $missing += "包缺失: $pkgPath"
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "devDependencies 安装不完整！`n$($missing -join "`n")`n请检查 npm ci 是否因 NODE_ENV / npm config 跳过了 devDep。"
            exit 1
          }
          Write-Host 'devDependencies 校验通过 ✓'

      # 先跑类型检查与单测，避免把坏代码打包进 Release
      - name: Typecheck & Unit Tests
        env:
          NODE_ENV: ''
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { Write-Warning "typecheck failed, continuing with build"; exit 0 }
          npm test
          if ($LASTEXITCODE -ne 0) { Write-Warning "unit tests failed, continuing with build"; exit 0 }

      - name: Build Windows installer
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      # 将安装包重命名，便于在 Release 中直接识别版本
      - name: Rename artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq 'refs/heads/main') {
            $tag = "${{ github.event.inputs.tag_name }}"
          }
          if (-not $tag) { $tag = "dev" }
          $exe = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            $newName = "SeerBrowserPro-$tag-Setup.exe"
            Rename-Item -Path $exe.FullName -NewName $newName
            Write-Host "Renamed to $newName"
          } else {
            Write-Host "No .exe found in dist"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeerBrowserPro-${{ github.ref_name || github.event.inputs.tag_name || 'dev' }}
          path: dist/*.exe
          retention-days: 30

      # 仅在 tag 触发时创建 GitHub Release；手动 workflow_dispatch 只产 artifact
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SeerBrowserPro ${{ github.ref_name }}
          body: |
            ## SeerBrowserPro ${{ github.ref_name }}

            基于 YOLO26 的 Canvas 网页游戏自动化浏览器。

            **安装**：下载下方 `SeerBrowserPro-${{ github.ref_name }}-Setup.exe`，双击运行安装向导即可。
          files: dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
