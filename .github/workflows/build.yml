name: Build & Release

# 触发方式：推送标签（vX.Y.Z）自动发布；也可在 Actions 页面手动运行
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '手动构建时填写版本号（如 v0.1.0），仅用于产物命名'
        required: false
        default: 'manual'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Electron 二进制 + onnxruntime-node 原生 .node 必须在 Windows runner 下载
      - name: Install dependencies
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci

      # 先跑类型检查与单测，避免把坏代码打包进 Release
      - name: Typecheck & Unit Tests
        run: |
          npm run typecheck
          npm test
        shell: pwsh

      - name: Build Windows installer
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      # 将安装包重命名，便于在 Release 中直接识别版本
      - name: Rename artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq 'refs/heads/main') {
            $tag = "${{ github.event.inputs.tag_name }}"
          }
          if (-not $tag) { $tag = "dev" }
          $exe = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            $newName = "SeerBrowserPro-$tag-Setup.exe"
            Rename-Item -Path $exe.FullName -NewName $newName
            Write-Host "Renamed to $newName"
          } else {
            Write-Host "No .exe found in dist"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeerBrowserPro-${{ github.ref_name || github.event.inputs.tag_name || 'dev' }}
          path: dist/*.exe
          retention-days: 30

      # 仅在 tag 触发时创建 GitHub Release；手动 workflow_dispatch 只产 artifact
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SeerBrowserPro ${{ github.ref_name }}
          body: |
            ## SeerBrowserPro ${{ github.ref_name }}

            基于 YOLO26 的 Canvas 网页游戏自动化浏览器。

            **安装**：下载下方 `SeerBrowserPro-${{ github.ref_name }}-Setup.exe`，双击运行安装向导即可。
          files: dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
