appId: com.seer.browserpro
productName: SeerBrowserPro
copyright: Copyright (c) 2026 SeerBrowserPro
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - node_modules/onnxruntime-node/**
  - resources/**
extraResources:
  - from: resources
    to: resources
  # python-bridge 打包态按 process.resourcesPath/python 查找脚本，
  # 而脚本位于仓库根的 python/ 目录，必须显式拷入 resources/python
  - from: python
    to: python
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
