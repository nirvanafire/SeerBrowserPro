appId: com.seer.browserpro
productName: SeerBrowserPro
copyright: Copyright (c) 2026 SeerBrowserPro
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - node_modules/onnxruntime-node/**
  - resources/**
extraResources:
  - from: resources
    to: resources
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
